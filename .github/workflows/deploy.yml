name: Deploy GitHub Pages frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bach-chorale-puzzle-production
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check the 45-question manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const questions = JSON.parse(fs.readFileSync("app/questions.generated.json", "utf8"));
          if (questions.length !== 45) throw new Error(`题目数量必须为 45，当前为 ${questions.length}`);
          const counts = Object.fromEntries(["chorale", "fugue", "other"].map((genre) => [genre, questions.filter((question) => question.genre === genre).length]));
          if (JSON.stringify(counts) !== JSON.stringify({ chorale: 30, fugue: 10, other: 5 })) {
            throw new Error(`题目分类必须为 30/10/5：${JSON.stringify(counts)}`);
          }
          const seed = fs.readFileSync("worker/migrations/0003_expand_chorales.sql", "utf8");
          const seedHeader = seed.match(/Questions:\s*(\d+)/i);
          if (!seedHeader || Number(seedHeader[1]) !== 45) throw new Error("D1 seed migration 必须包含最终 45 道题");
          const questionInserts = [...seed.matchAll(/INSERT INTO questions\s*\(/g)].length;
          if (questionInserts !== 45) throw new Error(`D1 seed migration 的题目 INSERT 数量必须为 45，当前为 ${questionInserts}`);
          for (const question of questions) {
            const voices = question.voiceOrder || Object.keys(question.voices || {});
            if (voices.length !== question.voiceCount) throw new Error(`${question.id} 声部数量与 voiceCount 不一致`);
            for (const voice of voices) {
              const candidates = question.voices?.[voice];
              if (!Array.isArray(candidates) || candidates.length !== 3) throw new Error(`${question.id}/${voice} 候选数量必须为 3`);
            }
          }
          console.log(JSON.stringify({ questions: questions.length, counts }, null, 2));
          NODE

  worker:
    name: Migrate D1 and deploy Worker
    # 后端部署默认关闭。设置 DEPLOY_WORKER=true 后才会读取 Cloudflare Secrets。
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    runs-on: ubuntu-latest
    needs: test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_BOOTSTRAP_USERNAME: ${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_D1_DATABASE_ID ADMIN_BOOTSTRAP_USERNAME ADMIN_BOOTSTRAP_PASSWORD SESSION_SECRET; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ -z "${WORKER_API_URL:-}" && -z "${NEXT_PUBLIC_API_BASE_URL:-}" ]]; then
            missing+=("WORKER_API_URL or NEXT_PUBLIC_API_BASE_URL (Actions Variable)")
          fi
          if (( ${#missing[@]} )); then
            printf '缺少 Cloudflare/GitHub 配置：%s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Prepare CI Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          cp worker/wrangler.toml worker/wrangler.ci.toml
          sed -i "s/00000000-0000-0000-0000-000000000000/${CLOUDFLARE_D1_DATABASE_ID}/" worker/wrangler.ci.toml
          cat > "$RUNNER_TEMP/worker-secrets.env" <<EOF
          ADMIN_BOOTSTRAP_USERNAME=$ADMIN_BOOTSTRAP_USERNAME
          ADMIN_BOOTSTRAP_PASSWORD=$ADMIN_BOOTSTRAP_PASSWORD
          SESSION_SECRET=$SESSION_SECRET
          EOF
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.ci.toml
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config worker/wrangler.ci.toml --secrets-file "$RUNNER_TEMP/worker-secrets.env" --keep-vars
      - name: Verify Worker health, default rules, and inventory
        shell: bash
        run: |
          set -euo pipefail
          API_URL="${WORKER_API_URL:-${NEXT_PUBLIC_API_BASE_URL}}"
          API_URL="${API_URL%/}"
          curl --fail --silent --show-error "$API_URL/api/health" | jq -e '.ok == true' >/dev/null
          session_json="$(curl --fail --silent --show-error -X POST "$API_URL/api/game/sessions" -H 'Content-Type: application/json' -d '{}')"
          printf '%s' "$session_json" | jq -e '.rules.questionsPerGame == 3 and .rules.allocation.chorale == 3 and .rules.allocation.fugue == 0 and .rules.allocation.other == 0 and .rules.scoreWeights.completeQuestion == 25 and .rules.scoreWeights.voiceAccuracy == 75 and (.questions | length) == 3 and ([.questions[].genre] | all(. == "chorale"))' >/dev/null
          printf '%s' "$session_json" | jq -e '([.questions[] | .voices | to_entries[] | .value[] | has("isOriginal")] | any) | not' >/dev/null
          login_json="$(curl --fail --silent --show-error -X POST "$API_URL/api/auth/login" -H 'Content-Type: application/json' -d "$(jq -n --arg username "$ADMIN_BOOTSTRAP_USERNAME" --arg password "$ADMIN_BOOTSTRAP_PASSWORD" '{username:$username,password:$password}')")"
          token="$(printf '%s' "$login_json" | jq -er '.token')"
          questions_json="$(curl --fail --silent --show-error "$API_URL/api/admin/questions" -H "Authorization: Bearer $token")"
          printf '%s' "$questions_json" | jq -e '(.questions | length) == 45' >/dev/null
          printf '%s' "$questions_json" | jq -e '([.questions[] | select(.genre == "chorale")] | length) == 30 and ([.questions[] | select(.genre == "fugue")] | length) == 10 and ([.questions[] | select(.genre == "other")] | length) == 5' >/dev/null
          printf 'Worker health, default rules, public answer stripping, and 45-question inventory passed.\n'
      - name: Remove CI-only configuration
        if: always()
        run: rm -f worker/wrangler.ci.toml "$RUNNER_TEMP/worker-secrets.env"

  build:
    name: Build and verify GitHub Pages site
    runs-on: ubuntu-latest
    # 前端发布不依赖 Worker，后端未配置时仍可更新 GitHub Pages。
    needs: test
    env:
      WORKER_API_URL: ${{ vars.WORKER_API_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-${WORKER_API_URL}}"
          if [[ -z "$NEXT_PUBLIC_API_BASE_URL" ]]; then
            echo '缺少 WORKER_API_URL 或 NEXT_PUBLIC_API_BASE_URL Actions Variable' >&2
            exit 1
          fi
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            export BASE_PATH=""
          else
            export BASE_PATH="/$repository_name"
          fi
          npm run build
          test -s out/index.html
          test -s out/admin/index.html
          touch out/.nojekyll
      - name: Verify all 30 question resources in static output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const questions = JSON.parse(fs.readFileSync("app/questions.generated.json", "utf8"));
          const expectedAudio = questions.reduce((total, question) => total + Object.values(question.voices).reduce((count, candidates) => count + candidates.length, 0), 0);
          const expectedScores = questions.reduce((total, question) => total + Object.values(question.voices).reduce((count, candidates) => count * candidates.length, 1), 0);
          const count = (root, extension) => {
            let total = 0;
            const visit = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const full = `${directory}/${entry.name}`;
                if (entry.isDirectory()) visit(full);
                else if (entry.name.endsWith(extension)) total += 1;
              }
            };
            visit(root);
            return total;
          };
          const mp3 = count("out/music", ".mp3");
          const wav = count("out/music", ".wav");
          const musicxml = count("out/music", ".musicxml");
          const svg = count("out/generated-scores", ".svg");
          if (mp3 !== expectedAudio || wav !== expectedAudio || musicxml !== expectedAudio || svg !== expectedScores) {
            throw new Error(`静态资源数量错误：预期音频/XML=${expectedAudio}、SVG=${expectedScores}；实际 MP3=${mp3} WAV=${wav} MusicXML=${musicxml} SVG=${svg}`);
          }
          console.log(JSON.stringify({ questions: questions.length, expectedAudio, expectedScores, mp3, wav, musicxml, svg }, null, 2));
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-pages:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
