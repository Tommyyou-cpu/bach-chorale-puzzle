name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export BASE_PATH=""
          else
            export BASE_PATH="/$REPO_NAME"
          fi
          npm run build
          if [[ -d "dist/client/$REPO_NAME/_next" ]]; then
            mv "dist/client/$REPO_NAME/_next" "dist/client/_next"
          fi
      - name: Verify mobile assets
        shell: bash
        run: |
          test "$(find dist/client/music -type f -name '*.mp3' | wc -l | tr -d ' ')" = "192"
          test "$(find dist/client/generated-scores -type f -name '*.svg' | wc -l | tr -d ' ')" = "1740"
          test -s "dist/client/generated-scores/q1/soprano-ivory--alto-ivory--tenor-ivory--bass-ivory.svg"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
